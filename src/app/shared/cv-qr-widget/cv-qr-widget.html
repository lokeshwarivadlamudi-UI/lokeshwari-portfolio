<div class="cv-widget">
  @if (isOpen()) {
    <section class="cv-panel" id="cv-qr-panel" aria-labelledby="cv-panel-title" animate.enter="cv-panel-in" animate.leave="cv-panel-out">
      <div class="cv-panel-heading">
        <div>
          <p class="cv-eyebrow">A QUICK LOOK AT MY EXPERIENCE</p>
          <h2 id="cv-panel-title">Take my CV with you.</h2>
        </div>
        <button class="close-button" #closeButton type="button" aria-label="Close CV panel" (click)="closePanel()">×</button>
      </div>
      <div class="cv-panel-body">
        <a class="qr-link" [href]="cvUrl" target="_blank" rel="noopener noreferrer" aria-label="Open the CV PDF">
          <img src="cv-qr.svg" alt="QR code that opens Lokeshwari Vadlamudi's CV PDF" width="144" height="144">
        </a>
        <div class="cv-panel-copy">
          <p class="cv-hint">Scan with your phone camera to open the PDF. On your phone? Tap Open CV.</p>
          <div class="cv-actions">
            <a class="cv-open" [href]="cvUrl" target="_blank" rel="noopener noreferrer">Open CV <span aria-hidden="true">↗</span></a>
            <button type="button" (click)="shareCv()">Share</button>
            <button type="button" (click)="copyCvLink()">Copy link</button>
          </div>
        </div>
      </div>
      <p class="share-status" role="status" aria-live="polite">{{ shareStatus() }}</p>
    </section>
  }
  <button #trigger class="cv-fab" type="button" [attr.aria-expanded]="isOpen()" aria-controls="cv-qr-panel" [attr.aria-label]="isOpen() ? 'Close CV menu' : 'Open CV QR code'" (click)="togglePanel()">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3h7v7H3V3Zm2 2v3h3V5H5Zm9-2h7v7h-7V3Zm2 2v3h3V5h-3ZM3 14h7v7H3v-7Zm2 2v3h3v-3H5Zm8-3h3v3h-3v-3Zm4 0h4v3h-4v-3Zm-4 5h3v3h-3v-3Zm4-1h4v4h-4v-4Z" /></svg>
    <span>CV</span>
  </button>
</div>
